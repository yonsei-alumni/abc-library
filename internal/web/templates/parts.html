{{define "cover"}}{{$src := cover .}}{{if $src}}<img class="cover" src="{{$src}}" alt="{{.Title}} 표지" loading="lazy" referrerpolicy="no-referrer">{{else}}<span class="cover cover-blank" aria-hidden="true">{{.Title}}</span>{{end}}{{end}}

{{define "tag-list"}}{{if .}}<ul class="tags">{{range .}}<li><a class="{{if isTopic .}}tag-topic{{end}}" href="/books?tag={{.}}">#{{.}}</a></li>{{end}}</ul>{{end}}{{end}}

{{define "links"}}{{if .}}<ul class="links">{{range .}}<li><a href="{{.URL}}" target="_blank" rel="noopener nofollow">{{.Title}}</a></li>{{end}}</ul>{{end}}{{end}}
