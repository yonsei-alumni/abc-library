{{define "layout"}}<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · ABC 도서관</title>
<meta name="description" content="아카라카북클럽(ABC)에서 함께 읽고 추천한 책">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#212126" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="ABC 도서관">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="{{static "icon.svg"}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{static "apple-touch-icon.png"}}">
<link rel="stylesheet" href="{{static "style.css"}}">
<script src="{{static "htmx.min.js"}}" defer></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</head>
<body hx-boost="true">
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><span class="brand-mark">ABC</span> 도서관</a>
    <form class="search" action="/books" method="get" role="search">
      <input type="search" name="q" value="{{with .Query}}{{.}}{{end}}" placeholder="제목, 저자, 태그 검색" aria-label="책 검색" autocomplete="off"
        hx-get="/books" hx-trigger="input changed delay:400ms, search" hx-target="#content" hx-select="#content" hx-swap="outerHTML" hx-push-url="true">
    </form>
    <nav class="nav">
      <a href="/" {{if eq .Nav "timeline"}}aria-current="page"{{end}}>소식</a>
      <a href="/books" {{if eq .Nav "books"}}aria-current="page"{{end}}>책</a>
      <a href="/tags" {{if eq .Nav "tags"}}aria-current="page"{{end}}>태그</a>
      <a href="/authors" {{if eq .Nav "authors"}}aria-current="page"{{end}}>저자</a>
      {{if .Admin}}<a href="/admin/tags" {{if eq .Nav "admin"}}aria-current="page"{{end}}>관리</a>{{end}}
    </nav>
  </div>
</header>
<main class="wrap" id="content">
{{template "content" .}}
</main>
<footer class="site-footer">
  <div class="wrap">
    아카라카북클럽(ABC) 밴드의 게시글과 댓글에 나온 책 이야기를 AI가 개인 정보를 빼고 요약했습니다.
    밴드 원문은 멤버만 볼 수 있습니다. 표지와 구매 링크는 교보문고를 따릅니다.
    {{if .Admin}}
    <form class="account" method="post" action="/logout"><span>{{.Admin}}</span> <button class="link-button">로그아웃</button></form>
    {{else if .LoginEnabled}}
    <p class="account"><a href="/login?next={{.Path}}" hx-boost="false">관리자 로그인</a></p>
    {{end}}
  </div>
</footer>
</body>
</html>{{end}}
