{{define "layout"}}<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · ABC 서재</title>
<meta name="description" content="아카라카북클럽(ABC)에서 함께 읽고 추천한 책">
<link rel="stylesheet" href="{{static "style.css"}}">
<script src="{{static "htmx.min.js"}}" defer></script>
</head>
<body hx-boost="true">
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><span class="brand-mark">ABC</span> 서재</a>
    <form class="search" action="/books" method="get" role="search">
      <input type="search" name="q" value="{{with .Query}}{{.}}{{end}}" placeholder="제목, 저자, 태그 검색" aria-label="책 검색" autocomplete="off"
        hx-get="/books" hx-trigger="input changed delay:400ms, search" hx-target="#content" hx-select="#content" hx-swap="outerHTML" hx-push-url="true">
    </form>
    <nav class="nav">
      <a href="/" {{if eq .Nav "timeline"}}aria-current="page"{{end}}>소식</a>
      <a href="/books" {{if eq .Nav "books"}}aria-current="page"{{end}}>책</a>
      <a href="/tags" {{if eq .Nav "tags"}}aria-current="page"{{end}}>태그</a>
      <a href="/authors" {{if eq .Nav "authors"}}aria-current="page"{{end}}>저자</a>
    </nav>
  </div>
</header>
<main class="wrap" id="content">
{{template "content" .}}
</main>
<footer class="site-footer">
  <div class="wrap">
    아카라카북클럽(ABC) 밴드의 게시글과 댓글에 나온 책 이야기를 AI가 개인 정보를 빼고 요약했습니다.
    밴드 원문은 멤버만 볼 수 있습니다. 표지와 구매 링크는 교보문고를 따릅니다.
  </div>
</footer>
</body>
</html>{{end}}
